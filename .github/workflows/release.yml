# Everything a tag produces.
#
# Two triggers, and only one of them can publish. A tag builds, signs and
# releases. `workflow_dispatch` builds and signs and stops there — a rehearsal,
# which is worth having because six package builds, a container each, and a GPG
# import are a lot of machinery to meet for the first time on the day it
# matters. What it cannot do is publish, so the original point stands: a
# release nobody tagged is a release started from the wrong commit.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # First, and everything depends on it: a tag that disagrees with Cargo.toml
  # produces packages whose filenames lie about their contents.
  check:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Sy --noconfirm --needed git rust gtk4 libadwaita sqlite openssl systemd-libs
      - uses: actions/checkout@v7
      # Skipped on a rehearsal, where the ref is a branch and there is no
      # version in it to agree with anything.
      - name: The tag, the manifest and the PKGBUILD must agree
        if: github.ref_type == 'tag'
        run: |
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          pkgver=$(grep -m1 '^pkgver=' packaging/aur/PKGBUILD | cut -d= -f2)
          tag="${GITHUB_REF_NAME#v}"
          echo "manifest=$manifest pkgver=$pkgver tag=$tag"
          test "$manifest" = "$tag"
          # The PKGBUILD carries the version separately and is what the AUR
          # publishes. One left behind builds a package whose name disagrees
          # with what is inside it.
          test "$pkgver" = "$tag"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      # A tag that fails an audit must not produce packages. The advisory
      # database moves under a lock file that does not, so this is the check
      # that goes stale between releases and has to run at each one.
      - run: |
          pacman -S --noconfirm --needed cargo-audit cargo-deny
          cargo audit
          cargo deny check

  # The AUR package is built by the person installing it, not here. So this
  # job's purpose is not an artefact: it is proving the PKGBUILD still works
  # before it is pushed, because a broken one is broken for everybody who
  # tries until somebody notices.
  # Two architectures everywhere below. `ubuntu-24.04-arm` is a native arm64
  # runner: cross-compiling a GTK application means an arm64 sysroot with every
  # development package in it, and emulation means hours per build, so native
  # is the only one of the three that is simply arithmetic.
  #
  # Those runners are free for public repositories and need a paid plan for
  # private ones. A private repository on the free plan will queue the arm jobs
  # until they time out rather than failing quickly, which is worth knowing
  # before a release is waited on.
  # x86_64 only, and deliberately: Arch publishes no official aarch64 image
  # (Arch Linux ARM is a separate project), and this job's purpose is to prove
  # the PKGBUILD still builds and installs — the AUR compiles it on the user's
  # own machine, whatever that machine is.
  arch:
    needs: check
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Sy --noconfirm --needed git rust gtk4 libadwaita sqlite openssl systemd-libs namcap sudo
      - uses: actions/checkout@v7
      - name: makepkg refuses to run as root, so it gets a user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder .
      # makepkg skips the download when the file is already beside the
      # PKGBUILD, so this builds the tree that was checked out. Two reasons:
      # a rehearsal has no tag to fetch, and even on a tag this is the source
      # that should be tested — the point of the job is to prove the PKGBUILD
      # builds *this commit*, not that GitHub can serve a tarball.
      - name: The source, from the checkout rather than the network
        run: |
          git config --global --add safe.directory "$PWD"
          version=$(grep -m1 '^pkgver=' packaging/aur/PKGBUILD | cut -d= -f2)
          git archive --format=tar.gz --prefix="sieve-$version/" \
            -o "packaging/aur/sieve-$version.tar.gz" HEAD
          ls -la packaging/aur/*.tar.gz

      - name: Build the package from the tag
        run: |
          cd packaging/aur
          sudo -u builder makepkg --syncdeps --noconfirm --cleanbuild
      - name: Install it, and run what was installed
        run: |
          pacman -U --noconfirm packaging/aur/*.pkg.tar.zst
          # Against the PKGBUILD's version, not the ref: on a rehearsal the
          # ref is a branch, and this compared `sieve 0.1.0` with `sieve
          # master`. Nothing is lost on a tag, where the check job has already
          # proved the tag and the PKGBUILD agree.
          version=$(grep -m1 '^pkgver=' packaging/aur/PKGBUILD | cut -d= -f2)
          test "$(sieve --version)" = "sieve $version"
          test -f /usr/share/applications/com.galaxoidlabs.Sieve.desktop
          test -f /usr/share/icons/hicolor/48x48/apps/com.galaxoidlabs.Sieve.png
          test -f /usr/share/icons/hicolor/512x512/apps/com.galaxoidlabs.Sieve.png
          test -f /usr/lib/udev/rules.d/51-sieve-hardware.rules
          desktop-file-validate /usr/share/applications/com.galaxoidlabs.Sieve.desktop
          udevadm verify /usr/lib/udev/rules.d/51-sieve-hardware.rules
          # The package has to carry its install script, and that script has to
          # say where the wallets are without touching them. A missing
          # `install=` is silent: the package builds, installs and runs, and the
          # only sign is somebody removing Sieve and being told nothing.
          # The main package by name, not by glob. `*.pkg.tar.zst` matched two
          # files the moment makepkg split a debug package off, and bsdtar read
          # the first as the archive and the second as a member to find inside
          # it — "Not found in archive", from a check that had nothing to do
          # with what broke. The PKGBUILD sets `!debug` so there is one again;
          # this makes the check say so rather than depend on it.
          built=$(ls packaging/aur/*.pkg.tar.zst | grep -v -- '-debug-')
          # `test -f` rather than counting lines: it refuses an empty result
          # too, which is makepkg having produced nothing at all. Counting
          # accepts that case, because one empty string is still one line.
          test -f "$built"
          bsdtar -xOf "$built" .INSTALL > /tmp/install.sh
          grep -q 'Your wallets have not been removed' /tmp/install.sh
          # And it must stay a message rather than becoming a cleanup hook.
          ! grep -qE '\brm\b|rmdir|unlink|-delete' /tmp/install.sh
      - name: What a reviewer would say about it
        run: namcap packaging/aur/*.pkg.tar.zst || true
      - uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: packaging/aur/*.pkg.tar.zst

  # Built in a container of the oldest supported release of each family: glibc
  # is forwards compatible and not backwards, so a binary linked on a newer one
  # will not run on an older.
  deb:
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:trixie', 'ubuntu:24.04']
        runner: ['ubuntu-latest', 'ubuntu-24.04-arm']
        # Matches on `runner`, so it labels the four combinations above rather
        # than adding to them.
        include:
          - { runner: 'ubuntu-latest', arch: amd64 }
          - { runner: 'ubuntu-24.04-arm', arch: arm64 }
    container: ${{ matrix.image }}
    steps:
      - run: |
          apt-get update
          apt-get install -y curl build-essential pkg-config libgtk-4-dev \
            libadwaita-1-dev libsqlite3-dev libssl-dev libudev-dev
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - uses: actions/checkout@v7
      - run: |
          . "$HOME/.cargo/env"
          cargo install cargo-deb --locked
          cargo deb --locked
          # cargo-deb names a package `sieve_0.1.0-1_amd64.deb` with nothing in
          # it about which distribution built it, so trixie and ubuntu produce
          # the same filename for the same architecture. Release assets are one
          # flat namespace: without this, two of the four quietly become one,
          # and `SHA256SUMS` lists a name that means two different files.
          codename=$(. /etc/os-release; echo "${ID}${VERSION_ID}")
          for f in target/debian/*.deb; do
            mv "$f" "${f%_*.deb}_${codename}_${f##*_}"
          done
          ls -la target/debian/
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}-${{ strategy.job-index }}
          path: target/debian/*.deb

  rpm:
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # No other dimension, so each entry is a combination in its own right.
        include:
          - { runner: 'ubuntu-latest', arch: x86_64 }
          - { runner: 'ubuntu-24.04-arm', arch: aarch64 }
    container: fedora:41
    steps:
      # The container is here for the glibc and system-library baseline, not
      # for the toolchain: Fedora ships rustc 1.91 and this needs 1.93, which
      # relm4 requires. rustup, as the .deb job already does — a distribution's
      # Rust and a project's MSRV move independently and always will.
      - run: |
          dnf install -y curl gcc pkgconf-pkg-config rpm-build \
            gtk4-devel libadwaita-devel sqlite-devel openssl-devel systemd-devel
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - uses: actions/checkout@v7
      - run: |
          . "$HOME/.cargo/env"
          cargo install cargo-generate-rpm --locked
          cargo build --release --locked
          cargo generate-rpm
      - uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.arch }}
          path: target/generate-rpm/*.rpm

  publish:
    needs: [arch, deb, rpm]
    runs-on: ubuntu-latest
    # Job level, not step level: a step's own `env:` is not in scope for that
    # step's `if:`, so the guard below was reading an empty string and the
    # signature was never made. A release that quietly ships unsigned is worse
    # than one that fails.
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSPHRASE }}
    steps:
      - uses: actions/download-artifact@v8
        with: { path: artifacts }
      - name: One signature, over the checksums
        run: |
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.zst' \) \
            -exec sha256sum {} + | sed 's|artifacts/[^/]*/||' > SHA256SUMS
          cat SHA256SUMS
      # The key lives in repository secrets and nowhere else. Rotating it is a
      # release note rather than a silent event.
      #
      # Sign a *subkey*, with the primary kept offline: if this runner is ever
      # compromised the subkey is revoked and the identity survives, where a
      # leaked primary means starting again and telling everybody to trust
      # something new.
      - name: Sign the checksums
        if: env.SIGNING_KEY != ''
        run: |
          echo "$SIGNING_KEY" | gpg --batch --yes --import
          # Loopback, because there is no terminal here to ask on. A key with
          # no passphrase would sign just as well and be worth less.
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$SIGNING_KEY_PASSPHRASE" \
              --detach-sign --armor SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS

      - name: Say what a rehearsal did and did not do
        if: github.ref_type != 'tag'
        run: |
          echo "::notice::Built, packaged and signed. No release was made — \
                push a v* tag for that."

      # Said out loud rather than discovered by whoever downloads it.
      - name: Say that this release is unsigned
        if: env.SIGNING_KEY == ''
        run: echo "::warning::No SIGNING_KEY set — publishing without a signature"

      # Everything above this line runs on a rehearsal, the signature
      # included. This is where the two part company.
      - uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          # A draft: the tag runs everything, the artefacts and the signature
          # land on it, and nobody can install any of it until a person has
          # looked and pressed publish. The argument for one trigger — that a
          # release started by hand starts from the wrong commit — is about
          # what gets built. What gets published is worth a pair of eyes,
          # especially the first time this path has ever run.
          draft: true
          # `SHA256SUMS.asc` only exists when the step above ran, and a missing
          # file is not an error to this action.
          files: |
            artifacts/**/*
            SHA256SUMS
            SHA256SUMS.asc

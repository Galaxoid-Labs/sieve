[package]
name = "sieve"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A privacy-focused Bitcoin wallet for Linux"
license = "MIT"
repository = "https://github.com/Galaxoid-Labs/sieve"

# What `cargo deb` and `cargo generate-rpm` build from. Without these both
# tools produce a package containing the binary and nothing else: no launcher
# entry, no icon, no udev rules — which installs cleanly and leaves somebody
# with a wallet they cannot start from their desktop and a hardware signer
# their user cannot see.

[package.metadata.deb]
maintainer = "Galaxoid Labs <jacob@galaxoidlabs.com>"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = """
Sieve syncs by downloading BIP157/158 compact block filters and matching them
locally, so no server is told which addresses belong to you. Every outbound
connection can be routed through Tor."""
# dpkg-shlibdeps reads the binary, which is the only list that cannot drift
# from what it actually links — as a hand-written one already had.
depends = "$auto"
assets = [
    ["target/release/sieve", "usr/bin/", "755"],
    ["data/com.galaxoidlabs.Sieve.desktop", "usr/share/applications/", "644"],
    ["data/icons/hicolor/16x16/apps/com.galaxoidlabs.Sieve.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["data/icons/hicolor/24x24/apps/com.galaxoidlabs.Sieve.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["data/icons/hicolor/32x32/apps/com.galaxoidlabs.Sieve.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["data/icons/hicolor/48x48/apps/com.galaxoidlabs.Sieve.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["data/icons/hicolor/64x64/apps/com.galaxoidlabs.Sieve.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["data/icons/hicolor/128x128/apps/com.galaxoidlabs.Sieve.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["data/icons/hicolor/256x256/apps/com.galaxoidlabs.Sieve.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["data/icons/hicolor/512x512/apps/com.galaxoidlabs.Sieve.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    # Without this a hardware signer is visible only to root.
    ["packaging/udev/51-sieve-hardware.rules", "usr/lib/udev/rules.d/", "644"],
    ["README.md", "usr/share/doc/sieve/", "644"],
    ["SECURITY.md", "usr/share/doc/sieve/", "644"],
]

[package.metadata.generate-rpm]
# rpm's own find-requires reads the binary, as dpkg-shlibdeps does above.
auto-req = "auto"
assets = [
    { source = "target/release/sieve", dest = "/usr/bin/sieve", mode = "755" },
    { source = "data/com.galaxoidlabs.Sieve.desktop", dest = "/usr/share/applications/com.galaxoidlabs.Sieve.desktop", mode = "644" },
    { source = "data/icons/hicolor/16x16/apps/com.galaxoidlabs.Sieve.png", dest = "/usr/share/icons/hicolor/16x16/apps/com.galaxoidlabs.Sieve.png", mode = "644" },
    { source = "data/icons/hicolor/24x24/apps/com.galaxoidlabs.Sieve.png", dest = "/usr/share/icons/hicolor/24x24/apps/com.galaxoidlabs.Sieve.png", mode = "644" },
    { source = "data/icons/hicolor/32x32/apps/com.galaxoidlabs.Sieve.png", dest = "/usr/share/icons/hicolor/32x32/apps/com.galaxoidlabs.Sieve.png", mode = "644" },
    { source = "data/icons/hicolor/48x48/apps/com.galaxoidlabs.Sieve.png", dest = "/usr/share/icons/hicolor/48x48/apps/com.galaxoidlabs.Sieve.png", mode = "644" },
    { source = "data/icons/hicolor/64x64/apps/com.galaxoidlabs.Sieve.png", dest = "/usr/share/icons/hicolor/64x64/apps/com.galaxoidlabs.Sieve.png", mode = "644" },
    { source = "data/icons/hicolor/128x128/apps/com.galaxoidlabs.Sieve.png", dest = "/usr/share/icons/hicolor/128x128/apps/com.galaxoidlabs.Sieve.png", mode = "644" },
    { source = "data/icons/hicolor/256x256/apps/com.galaxoidlabs.Sieve.png", dest = "/usr/share/icons/hicolor/256x256/apps/com.galaxoidlabs.Sieve.png", mode = "644" },
    { source = "data/icons/hicolor/512x512/apps/com.galaxoidlabs.Sieve.png", dest = "/usr/share/icons/hicolor/512x512/apps/com.galaxoidlabs.Sieve.png", mode = "644" },
    { source = "packaging/udev/51-sieve-hardware.rules", dest = "/usr/lib/udev/rules.d/51-sieve-hardware.rules", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/sieve/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/sieve/README.md", mode = "644", doc = true },
    { source = "SECURITY.md", dest = "/usr/share/doc/sieve/SECURITY.md", mode = "644", doc = true },
]

[dependencies]
# UI. `libadwaita` makes RelmApp build an adw::Application; `gnome_46` pins
# libadwaita 1.5 as the baseline (see CLAUDE.md before raising it).
relm4 = { version = "0.11", features = ["libadwaita", "gnome_46"] }
relm4-components = { version = "0.11", features = ["libadwaita"] }

# Wallet. Versions pinned to the pairing bdk-ffi ships, which is known-good.
bdk_wallet = { version = "3.1.0", features = ["all-keys", "keys-bip39", "rusqlite"] }
bdk_kyoto = "0.17.0"

# Secrets at rest.
argon2 = "0.6"
chacha20poly1305 = "0.11"
getrandom = "0.4"
zeroize = { version = "1.9", features = ["derive"] }
secrecy = "0.10"

# The one outbound connection that is not Bitcoin p2p, and only when the
# person turns it on. Blocking and small, with rustls rather than OpenSSL.
# `socks-proxy` so the two HTTP calls can be routed through Tor along with
# everything else. A wallet that tunnels its peers and then asks a price
# service over the clear is worse than one that never claimed to.
ureq = { version = "3", features = ["socks-proxy"] }

# QR rendering. Pure Rust, no C dependency, and nothing leaves the machine.
qrcode = { version = "0.14", default-features = false }

# Plumbing.
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
libc = "0.2"

# Onion addresses carry a SHA3-256 checksum, and bitcoin_hashes at this version
# has no SHA3. Used for nothing else.
sha3 = "0.10"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-hwi = { version = "0.0.32", default-features = false, features = ["ledger", "coldcard", "specter"] }

# Two unrelated hot paths make an unoptimised dependency tree unusable here:
# Argon2 takes ~36s per unlock at opt-level 0, and matching BIP158 filters is
# SipHash plus Golomb-Rice decoding over hundreds of thousands of blocks. Both
# live entirely in dependencies, so optimise those while our own code stays
# unoptimised and debuggable.
[profile.dev.package."*"]
opt-level = 3
# As close to release as a dev build gets for the code that does the work.
# Filter matching decodes a Golomb-coded set and intersects it against every
# script this wallet watches, a couple of hundred thousand times over — a hot
# loop where an overflow check on every arithmetic operation is not free. Our
# own crate keeps its checks; these are libraries we are not debugging.
debug-assertions = false
overflow-checks = false

# And a little for our own code. Dependencies do the heavy lifting — filter
# matching lives in bip157 and bdk — but a summary is rebuilt on every update,
# walking every transaction and every output, and at opt-level 0 that is felt
# during a scan. Level 1 keeps builds quick and debuggable.
[profile.dev]
opt-level = 1

[build-dependencies]
# Compiles the icons into the binary, so they travel with it.
glib-build-tools = "0.21"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package]
name = "sieve"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A privacy-focused Bitcoin wallet for Linux"
license = "MIT OR Apache-2.0"

[dependencies]
# UI. `libadwaita` makes RelmApp build an adw::Application; `gnome_46` pins
# libadwaita 1.5 as the baseline (see CLAUDE.md before raising it).
relm4 = { version = "0.11", features = ["libadwaita", "gnome_46"] }
relm4-components = { version = "0.11", features = ["libadwaita"] }

# Wallet. Versions pinned to the pairing bdk-ffi ships, which is known-good.
bdk_wallet = { version = "3.1.0", features = ["all-keys", "keys-bip39", "rusqlite"] }
bdk_kyoto = "0.17.0"

# Secrets at rest.
argon2 = "0.6"
chacha20poly1305 = "0.11"
getrandom = "0.4"
zeroize = { version = "1.9", features = ["derive"] }
secrecy = "0.10"

# Plumbing.
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
libc = "0.2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Argon2 at opt-level 0 takes ~36s per unlock, which makes the debug build
# unusable for anything that touches the vault. Optimise just the KDF crates;
# our own code stays unoptimised and debuggable.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
